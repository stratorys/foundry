[package]
name = "foundry-infer-cli"
description = "Command-line interface of the Foundry out-of-core GPU runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "foundry"
path = "src/main.rs"

[dependencies]
clap.workspace = true
foundry-infer-core.workspace = true
foundry-infer-plan.workspace = true
foundry-infer-runtime = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
foundry-infer-llama = { workspace = true, optional = true }
foundry-infer-metal = { workspace = true, optional = true }

[features]
default = []
metal = ["dep:foundry-infer-llama", "dep:foundry-infer-metal", "dep:foundry-infer-runtime"]

[dev-dependencies]
foundry-infer-core.workspace = true
foundry-infer-plan.workspace = true

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
