[package]
name = "foundry-infer-metal"
description = "Metal backend of the Foundry runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
foundry-infer-core.workspace = true
foundry-infer-runtime.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLEvent",
    "MTLLibrary",
    "MTLResource",
    "MTLTypes",
] }

[dev-dependencies]
foundry-infer-plan.workspace = true

[lints]
workspace = true
