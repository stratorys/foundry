[package]
name = "foundry-infer-llama"
description = "Resident Llama inference on Foundry Metal kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
half = { version = "2.7.1", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11.0", default-features = false }

[features]
default = []
probe = []

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes"] }

[[test]]
name = "mlx_fixtures"
required-features = ["probe"]
