[package]
name = "foundry"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking"] }
memmap2 = { version = "0.9.11", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
uninlined_format_args = "deny"
missing_assert_message = "deny"
self_named_module_files = "deny"
wildcard_imports = "deny"
semicolon_outside_block = "deny"
single_char_lifetime_names = "deny"
str_to_string = "deny"
unwrap_used = "deny"
new_without_default = "allow"
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
struct_field_names = "allow"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
undocumented_unsafe_blocks = "deny"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLBuffer", "MTLResource", "MTLCommandQueue", "MTLCommandBuffer", "MTLCommandEncoder", "MTLBlitCommandEncoder", "MTLLibrary", "MTLAllocation", "MTLComputePipeline", "MTLComputeCommandEncoder", "MTLTypes"] }
